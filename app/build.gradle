plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' version '2.0.21' }

def releaseKeystorePath = System.getenv("OBA_KEYSTORE_PATH")
def bazaarRsaPublicKey = (System.getenv("OBA_BAZAAR_RSA_PUBLIC_KEY") ?: "").replace("\n", "").replace("\r", "")
def bazaarSubscriptionId = System.getenv("OBA_BAZAAR_SUBSCRIPTION_ID") ?: "OBA110"

android {
    namespace 'ir.khone.yar'
    compileSdk 35
    defaultConfig {
        applicationId 'ir.khone.yar'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        buildConfigField 'String', 'BAZAAR_RSA_PUBLIC_KEY', '"' + bazaarRsaPublicKey + '"'
        buildConfigField 'String', 'BAZAAR_SUBSCRIPTION_ID', '"' + bazaarSubscriptionId + '"'
    }

    signingConfigs {
        release {
            if (releaseKeystorePath != null && !releaseKeystorePath.isEmpty()) {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("OBA_KEYSTORE_PASSWORD")
                keyAlias System.getenv("OBA_KEY_ALIAS")
                keyPassword System.getenv("OBA_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseKeystorePath != null && !releaseKeystorePath.isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures { buildConfig true }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.47'
    implementation 'com.github.cafebazaar.Poolakey:poolakey:2.2.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
    testImplementation 'junit:junit:4.13.2'
}
