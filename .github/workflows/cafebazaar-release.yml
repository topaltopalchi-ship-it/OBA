name: Build OBA CafeBazaar AAB and BIN

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Validate release signing secrets
        env:
          OBA_KEYSTORE_BASE64: ${{ secrets.OBA_KEYSTORE_BASE64 }}
          OBA_KEYSTORE_PASSWORD: ${{ secrets.OBA_KEYSTORE_PASSWORD }}
          OBA_KEY_ALIAS: ${{ secrets.OBA_KEY_ALIAS }}
          OBA_KEY_PASSWORD: ${{ secrets.OBA_KEY_PASSWORD }}
        run: |
          if [[ -z "$OBA_KEYSTORE_BASE64" || -z "$OBA_KEYSTORE_PASSWORD" || -z "$OBA_KEY_ALIAS" || -z "$OBA_KEY_PASSWORD" ]]; then
            echo "::error::Missing release signing secrets. Configure OBA_KEYSTORE_BASE64, OBA_KEYSTORE_PASSWORD, OBA_KEY_ALIAS, and OBA_KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          printf '%s' "$OBA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oba-release.jks"
          chmod 600 "$RUNNER_TEMP/oba-release.jks"
          test -s "$RUNNER_TEMP/oba-release.jks"

      - name: Build signed release AAB
        env:
          OBA_BAZAAR_RSA_PUBLIC_KEY: ${{ secrets.OBA_BAZAAR_RSA_PUBLIC_KEY }}
          OBA_BAZAAR_SUBSCRIPTION_ID: ${{ vars.OBA_BAZAAR_SUBSCRIPTION_ID }}
          OBA_KEYSTORE_PATH: ${{ runner.temp }}/oba-release.jks
          OBA_KEYSTORE_PASSWORD: ${{ secrets.OBA_KEYSTORE_PASSWORD }}
          OBA_KEY_ALIAS: ${{ secrets.OBA_KEY_ALIAS }}
          OBA_KEY_PASSWORD: ${{ secrets.OBA_KEY_PASSWORD }}
        run: |
          gradle --no-daemon testReleaseUnitTest bundleRelease
          mkdir -p output
          cp app/build/outputs/bundle/release/app-release.aab output/OBA.aab

      - name: Download BundleSigner
        run: |
          curl -fL --retry 3 \
            https://github.com/cafebazaar/bundle-signer/releases/download/v0.1.14/bundlesigner-0.1.14.jar \
            -o "$RUNNER_TEMP/bundlesigner.jar"

      - name: Generate CafeBazaar BIN from the same AAB
        env:
          KS_PASSWORD: ${{ secrets.OBA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OBA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OBA_KEY_PASSWORD }}
        run: |
          java -jar "$RUNNER_TEMP/bundlesigner.jar" genbin \
            -v \
            --bundle output/OBA.aab \
            --bin output/OBA.bin \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --ks "$RUNNER_TEMP/oba-release.jks" \
            --ks-pass "pass:$KS_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD"
          test -s output/OBA.aab
          test -s output/OBA.bin

      - name: Upload AAB and BIN for CafeBazaar
        uses: actions/upload-artifact@v4
        with:
          name: OBA-CafeBazaar-AAB-BIN
          path: |
            output/OBA.aab
            output/OBA.bin
          if-no-files-found: error
          retention-days: 30

      - name: Clean up signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/oba-release.jks"
