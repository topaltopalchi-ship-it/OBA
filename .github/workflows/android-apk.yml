name: Build OBA Android APK

on:
  push:
    branches: [ main, fix/offline-persian-tts, test/disable-vosk-recognition, test/mic-button-noop, feature/always-on-oba-wakeword ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          tools: platform-tools
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic
      - name: Build and test debug APK
        env:
          OBA_BAZAAR_RSA_PUBLIC_KEY: ${{ secrets.OBA_BAZAAR_RSA_PUBLIC_KEY }}
          OBA_BAZAAR_SUBSCRIPTION_ID: ${{ vars.OBA_BAZAAR_SUBSCRIPTION_ID }}
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OBA-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Prepare release signing key
        id: release-signing
        shell: bash
        env:
          OBA_KEYSTORE_BASE64: ${{ secrets.OBA_KEYSTORE_BASE64 }}
          OBA_KEYSTORE_PASSWORD: ${{ secrets.OBA_KEYSTORE_PASSWORD }}
          OBA_KEY_ALIAS: ${{ secrets.OBA_KEY_ALIAS }}
          OBA_KEY_PASSWORD: ${{ secrets.OBA_KEY_PASSWORD }}
        run: |
          if [[ -z "$OBA_KEYSTORE_BASE64" || -z "$OBA_KEYSTORE_PASSWORD" || -z "$OBA_KEY_ALIAS" || -z "$OBA_KEY_PASSWORD" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured; skipping release APK."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/oba-release.jks"
          printf '%s' "$OBA_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "Keystore decode failed." >&2
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
      - name: Build signed release APK
        if: steps.release-signing.outputs.configured == 'true'
        env:
          OBA_BAZAAR_RSA_PUBLIC_KEY: ${{ secrets.OBA_BAZAAR_RSA_PUBLIC_KEY }}
          OBA_BAZAAR_SUBSCRIPTION_ID: ${{ vars.OBA_BAZAAR_SUBSCRIPTION_ID }}
          OBA_KEYSTORE_PATH: ${{ steps.release-signing.outputs.keystore_path }}
          OBA_KEYSTORE_PASSWORD: ${{ secrets.OBA_KEYSTORE_PASSWORD }}
          OBA_KEY_ALIAS: ${{ secrets.OBA_KEY_ALIAS }}
          OBA_KEY_PASSWORD: ${{ secrets.OBA_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Upload signed release APK
        if: steps.release-signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OBA-Android-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: steps.release-signing.outputs.configured == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" app/build/outputs/apk/release/app-release.apk \
            --title "OBA $RELEASE_TAG" \
            --notes "نسخهٔ رسمی OBA برای اندروید. فایل APK امضاشده پیوست این انتشار است."
